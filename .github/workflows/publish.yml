name: Publish extension release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (<extension-id>-v<semver>) to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  AUTH_TOKEN_URL: https://auth.fossbilling.net/oauth2/token
  API_BASE_URL: https://api.fossbilling.net/extensions/v2
  API_AUDIENCE: https://api.fossbilling.net

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publisher credentials live in this environment, which requires an
    # approval from a designated reviewer before the job runs. That keeps a
    # collaborator from exfiltrating the secrets by dispatching a modified
    # workflow from another branch: the code from their ref only executes
    # after a reviewer has approved that specific run.
    environment: catalogue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve extension and version from tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if ! echo "$TAG" | grep -Eq '^.+-(v[0-9]+\.[0-9]+\.[0-9]+.*)$'; then
            echo "::error::Tag '$TAG' does not match <extension-id>-v<semver>"
            exit 1
          fi
          EXT_ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "extension_id=$EXT_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $EXT_ID version $VERSION"

      - name: Fetch machine token
        id: token
        run: |
          RESP=$(curl -sS -u "$PUBLISHER_CLIENT_ID:$PUBLISHER_CLIENT_SECRET" \
            "$AUTH_TOKEN_URL" \
            -d grant_type=client_credentials \
            -d "scope=extensions:push extensions:publish" \
            -d "resource=$API_AUDIENCE")
          ACCESS=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$ACCESS" ]; then
            echo "::error::Token request failed: $RESP"
            exit 1
          fi
          echo "access_token=$ACCESS" >> "$GITHUB_OUTPUT"
        env:
          PUBLISHER_CLIENT_ID: ${{ secrets.MODULES_PUBLISHER_CLIENT_ID }}
          PUBLISHER_CLIENT_SECRET: ${{ secrets.MODULES_PUBLISHER_CLIENT_SECRET }}

      - name: Build extension payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_payload.py "${{ steps.target.outputs.extension_id }}" "${{ steps.target.outputs.version }}" "${{ steps.target.outputs.tag }}"

      - name: Submit revision (create or update)
        id: submit
        env:
          API_TOKEN: ${{ steps.token.outputs.access_token }}
          EXT_ID: ${{ steps.target.outputs.extension_id }}
        run: |
          api() { # method path [body-file] -> sets HTTP_CODE/HTTP_BODY
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              HTTP_BODY=$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" \
                -d @"$body" "$API_BASE_URL$path")
            else
              HTTP_BODY=$(curl -sS -D headers.txt -o body.txt -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $API_TOKEN" "$API_BASE_URL$path")
            fi
            HTTP_CODE="$HTTP_BODY"
            HTTP_BODY=$(cat body.txt)
          }
          retry_after() { # seconds from the Retry-After response header, default 60
            grep -i '^retry-after:' headers.txt | tail -1 | tr -d '\r' | awk '{print $2}' | grep -Eq '^[0-9]+$' \
              && grep -i '^retry-after:' headers.txt | tail -1 | tr -d '\r' | awk '{print $2}' || echo 60
          }

          EXISTS=0
          api GET "/extensions/$EXT_ID" && [ "$HTTP_CODE" = "200" ] && EXISTS=1

          attempt=0
          while :; do
            if [ "$EXISTS" = "1" ]; then
              api PUT "/extensions/$EXT_ID" payload.json
              ok=202
            else
              api POST "/extensions" payload.json
              ok=201
            fi
            if [ "$HTTP_CODE" = "429" ] && [ "$attempt" -lt 3 ]; then
              WAIT=$(retry_after)
              echo "Rate limited, waiting ${WAIT}s (attempt $((attempt + 1))/3)"
              sleep "$WAIT"
              attempt=$((attempt + 1))
              continue
            fi
            if [ "$HTTP_CODE" = "409" ] && [ "$EXISTS" = "0" ] && echo "$HTTP_BODY" | grep -q "already exists"; then
              echo "Extension appeared between check and create, switching to update"
              EXISTS=1
              continue
            fi
            break
          done

          if [ "$HTTP_CODE" = "409" ]; then
            echo "::error::API refused with 409: $HTTP_BODY"
            echo "::error::A revision is likely already pending review — a moderator must approve or withdraw it before this release can publish."
            exit 1
          fi
          if [ "$HTTP_CODE" != "$ok" ]; then
            echo "::error::Submit failed ($HTTP_CODE): $HTTP_BODY"
            exit 1
          fi
          REVISION_ID=$(echo "$HTTP_BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['revision_id'])")
          echo "revision_id=$REVISION_ID" >> "$GITHUB_OUTPUT"
          echo "Submitted revision $REVISION_ID (HTTP $HTTP_CODE)"

      - name: Approve revision
        env:
          API_TOKEN: ${{ steps.token.outputs.access_token }}
          EXT_ID: ${{ steps.target.outputs.extension_id }}
          REVISION_ID: ${{ steps.submit.outputs.revision_id }}
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$API_BASE_URL/extensions/$EXT_ID/revisions/$REVISION_ID/approve?notify=false")
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          if [ "$CODE" = "409" ]; then
            echo "::error::Approve refused with 409: $BODY"
            echo "::error::Ownership changed since the revision was proposed, or it is no longer pending."
            exit 1
          fi
          if [ "$CODE" != "200" ]; then
            echo "::error::Approve failed ($CODE): $BODY"
            exit 1
          fi
          echo "Published $EXT_ID (revision $REVISION_ID)"
